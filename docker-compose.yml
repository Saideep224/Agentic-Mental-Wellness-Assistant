version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: esona-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: esona
      POSTGRES_USER: esona
      POSTGRES_PASSWORD: esona_dev_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esona"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
