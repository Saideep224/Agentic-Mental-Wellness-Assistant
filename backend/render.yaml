services:
  - type: web
    name: esona-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./esona.db
      - key: JWT_SECRET
        value: esona-local-dev-jwt-secret-key-2026
      - key: USE_UNCLOSEAI
        value: "true"
      - key: FRONTEND_URL
        value: https://agentic-mental-wellness-assistant.vercel.app
